<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reports — EZEE VISION CHAMPUA</title>
<style>
body{font-family:system-ui,Arial;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:1050px;margin:auto;padding:22px}
.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #00000012}button{padding:11px 14px;border:0;border-radius:10px;cursor:pointer;margin:4px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:left}h1{margin-bottom:4px}.muted{color:#667}
</style></head><body><div class="wrap">
<h1>EZEE VISION CHAMPUA — Reports Center</h1><div class="muted">Phase 4 • Print & Export</div>
<div class="card"><button id="students">Student Report</button><button id="fees">Fees Report</button><button id="attendance">Attendance Report</button><button id="expenses">Expense Report</button></div>
<div class="card"><div id="output">Choose a report.</div></div>
<script src="assets/js/phase4-core.js"></script>
<script>
const q=id=>document.getElementById(id), P=window.EVPhase4;
const name=(s)=>s.name||s.studentName||"";
function render(type){
 let rows=[], cols=[];
 if(type==="students"){rows=P.collection("students");cols=[{key:"name",label:"Student"},{key:"class",label:"Class"},{key:"batch",label:"Batch"},{key:"mobile",label:"Mobile"}]}
 if(type==="fees"){rows=P.collection("fees");cols=[{key:"date",label:"Date"},{key:"studentName",label:"Student"},{key:"amount",label:"Amount"},{key:"mode",label:"Mode"}]}
 if(type==="attendance"){let a=P.state.attendance||{};rows=Object.entries(a).map(([date,v])=>({date,...(typeof v==="object"?v:{status:v})}));cols=[{key:"date",label:"Date"},{key:"status",label:"Status"},{key:"studentName",label:"Student"}]}
 if(type==="expenses"){rows=P.collection("expenses");cols=[{key:"date",label:"Date"},{key:"category",label:"Category"},{key:"amount",label:"Amount"},{key:"note",label:"Note"}]}
 q("output").innerHTML=(rows.length?P.reportTable(rows,cols):"<p>No records available yet.</p>")+
 (rows.length?'<p><button id="print">Print / Save PDF</button><button id="csv">Export CSV</button></p>':"");
 if(rows.length){q("print").onclick=()=>P.print(type.toUpperCase()+" REPORT",q("output").querySelector("table").outerHTML);q("csv").onclick=()=>P.csv(rows,type+"-report.csv")}
}
q("students").onclick=()=>render("students");q("fees").onclick=()=>render("fees");q("attendance").onclick=()=>render("attendance");q("expenses").onclick=()=>render("expenses");
</script></div></body></html>
