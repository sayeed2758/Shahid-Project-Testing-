<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071a46">
  <meta name="description" content="EZEE VISION CHAMPUA Student Learning Portal">
  <title>EZEE VISION CHAMPUA</title>
  <link rel="icon" type="image/png" href="./assets/images/logo.png">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="./assets/images/logo.png" alt="EZEE VISION logo" class="brand-logo">
        <div>
          <span class="brand-kicker">EZEE VISION</span>
          <strong>CHAMPUA</strong>
        </div>
      </div>
      <button class="icon-button" type="button" data-action="profile" aria-label="Open profile">EV</button>
    </header>

    <main id="view" class="main-view" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button type="button" class="nav-item is-active" data-route="home">
        <span class="nav-icon">⌂</span><span>Home</span>
      </button>
      <button type="button" class="nav-item" data-route="classes">
        <span class="nav-icon">▦</span><span>Classes</span>
      </button>
      <button type="button" class="nav-item" data-route="search">
        <span class="nav-icon">⌕</span><span>Search</span>
      </button>
      <button type="button" class="nav-item" data-route="recent">
        <span class="nav-icon">◷</span><span>Recent</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
