<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports | EZEE VISION CHAMPUA</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#18202a}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 5px 18px #0001}button,input,select{padding:10px;margin:4px;border-radius:8px;border:1px solid #ccc}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;font-size:12px}th{background:#eee}.actions{margin-bottom:12px}</style></head><body><div class="wrap"><h1>EZEE VISION CHAMPUA</h1><p>Advanced Reports Center</p><div class="card"><select id="type"><option value="students">Students</option><option value="batches">Batches</option><option value="attendance">Attendance</option><option value="fees">Fees</option><option value="expenses">Expenses</option><option value="exams">Exams</option><option value="enquiries">Enquiries</option><option value="staff">Staff</option></select><input id="from" type="date"><input id="to" type="date"><button id="run">Generate</button><button id="print">Print / PDF</button><button id="csv">CSV</button></div><div class="card" id="out"></div></div><script src="assets/js/services/store.js"></script><script src="assets/js/services/crud.js"></script><script>let rows=[];const type=document.getElementById("type"),out=document.getElementById("out"),from=document.getElementById("from"),to=document.getElementById("to");function gen(){rows=EVStore.arr(type.value).filter(x=>(!from.value||String(x.date||x.createdAt).slice(0,10)>=from.value)&&(!to.value||String(x.date||x.createdAt).slice(0,10)<=to.value));if(!rows.length){out.innerHTML="<p>No data.</p>";return}let cols=[...new Set(rows.flatMap(x=>Object.keys(x)))].filter(k=>k!=="id").slice(0,10);out.innerHTML="<table><thead><tr>"+cols.map(c=>"<th>"+EVCRUD.esc(c)+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+cols.map(c=>"<td>"+EVCRUD.esc(r[c])+"</td>").join("")+"</tr>").join("")+"</tbody></table>"}document.getElementById("run").onclick=gen;document.getElementById("csv").onclick=()=>EVCRUD.csv(rows,type.value+"-report.csv");document.getElementById("print").onclick=()=>EVCRUD.print(type.value.toUpperCase()+" REPORT",out.innerHTML);gen();</script></body></html>
